<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b23a2f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="480" fill="#faf8f4"/>

  <!-- Divider -->
  <line x1="450" y1="30" x2="450" y2="450" stroke="#d8d2c4" stroke-width="1.5"/>

  <!-- ============ LEFT PANEL: A* known grid ============ -->
  <text x="225" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">A* — the known maze</text>
  <text x="225" y="56" text-anchor="middle" font-size="13" fill="#6b6459" font-style="italic">every wall is on the map before you start</text>

  <!-- Grid: 7x7, cell size 40, origin (45,80) -->
  <g stroke="#d8d2c4" stroke-width="1">
    <!-- vertical lines -->
    <line x1="45" y1="80" x2="45" y2="360"/>
    <line x1="85" y1="80" x2="85" y2="360"/>
    <line x1="125" y1="80" x2="125" y2="360"/>
    <line x1="165" y1="80" x2="165" y2="360"/>
    <line x1="205" y1="80" x2="205" y2="360"/>
    <line x1="245" y1="80" x2="245" y2="360"/>
    <line x1="285" y1="80" x2="285" y2="360"/>
    <line x1="325" y1="80" x2="325" y2="360"/>
    <line x1="365" y1="80" x2="365" y2="360"/>
    <line x1="405" y1="80" x2="405" y2="360"/>
    <!-- horizontal lines -->
    <line x1="45" y1="80" x2="405" y2="80"/>
    <line x1="45" y1="120" x2="405" y2="120"/>
    <line x1="45" y1="160" x2="405" y2="160"/>
    <line x1="45" y1="200" x2="405" y2="200"/>
    <line x1="45" y1="240" x2="405" y2="240"/>
    <line x1="45" y1="280" x2="405" y2="280"/>
    <line x1="45" y1="320" x2="405" y2="320"/>
    <line x1="45" y1="360" x2="405" y2="360"/>
  </g>

  <!-- Known walls (dark blocks, visible from the start) -->
  <rect x="125" y="120" width="40" height="80" fill="#5c5548"/>
  <rect x="245" y="160" width="40" height="120" fill="#5c5548"/>
  <rect x="325" y="80" width="40" height="80" fill="#5c5548"/>

  <!-- Start and goal -->
  <circle cx="65" cy="340" r="10" fill="#3a7a5d"/>
  <text x="65" y="375" text-anchor="middle" font-size="12" fill="#3a7a5d">start</text>
  <circle cx="385" cy="100" r="10" fill="#b23a2f"/>
  <text x="385" y="70" text-anchor="middle" font-size="12" fill="#b23a2f">goal</text>

  <!-- Single smooth path computed once, no detours -->
  <path d="M65,340 L205,340 L205,140 L305,140 L305,180 L385,180 L385,100"
        fill="none" stroke="#2b2b2b" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>

  <text x="225" y="400" text-anchor="middle" font-size="13" fill="#4a453d">One optimal route, computed once.</text>
  <text x="225" y="420" text-anchor="middle" font-size="13" fill="#4a453d">The grid never changes mid-search.</text>

  <!-- ============ RIGHT PANEL: Rome — unknown obstacles ============ -->
  <text x="675" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Rome — the unmapped city</text>
  <text x="675" y="56" text-anchor="middle" font-size="13" fill="#6b6459" font-style="italic">the walls reveal themselves as you dig</text>

  <!-- Grid: same layout -->
  <g stroke="#d8d2c4" stroke-width="1">
    <line x1="495" y1="80" x2="495" y2="360"/>
    <line x1="535" y1="80" x2="535" y2="360"/>
    <line x1="575" y1="80" x2="575" y2="360"/>
    <line x1="615" y1="80" x2="615" y2="360"/>
    <line x1="655" y1="80" x2="655" y2="360"/>
    <line x1="695" y1="80" x2="695" y2="360"/>
    <line x1="735" y1="80" x2="735" y2="360"/>
    <line x1="775" y1="80" x2="775" y2="360"/>
    <line x1="815" y1="80" x2="815" y2="360"/>
    <line x1="855" y1="80" x2="855" y2="360"/>
    <line x1="495" y1="80" x2="855" y2="80"/>
    <line x1="495" y1="120" x2="855" y2="120"/>
    <line x1="495" y1="160" x2="855" y2="160"/>
    <line x1="495" y1="200" x2="855" y2="200"/>
    <line x1="495" y1="240" x2="855" y2="240"/>
    <line x1="495" y1="280" x2="855" y2="280"/>
    <line x1="495" y1="320" x2="855" y2="320"/>
    <line x1="495" y1="360" x2="855" y2="360"/>
  </g>

  <!-- One obstacle marked as "undiscovered" (faint, dashed outline, revealed only where the path hits it) -->
  <rect x="655" y="160" width="40" height="80" fill="none" stroke="#b23a2f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="675" y="207" text-anchor="middle" font-size="10" fill="#b23a2f">ruin found</text>
  <text x="675" y="219" text-anchor="middle" font-size="10" fill="#b23a2f">mid-dig</text>

  <!-- Start and goal -->
  <circle cx="515" cy="340" r="10" fill="#3a7a5d"/>
  <text x="515" y="375" text-anchor="middle" font-size="12" fill="#3a7a5d">start</text>
  <circle cx="835" cy="100" r="10" fill="#b23a2f"/>
  <text x="835" y="70" text-anchor="middle" font-size="12" fill="#b23a2f">goal</text>

  <!-- Path: begins straight toward goal, hits the obstacle, reroutes -->
  <path d="M515,340 L515,260 L595,260 L595,220 L655,220"
        fill="none" stroke="#2b2b2b" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- reroute segment in red, after hitting the wall -->
  <path d="M655,220 L615,220 L615,140 L735,140 L735,100 L835,100"
        fill="none" stroke="#b23a2f" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowhead-red)"/>
  <!-- mark the point of discovery -->
  <circle cx="655" cy="220" r="6" fill="#b23a2f"/>

  <text x="675" y="400" text-anchor="middle" font-size="13" fill="#4a453d">The route bends the moment</text>
  <text x="675" y="420" text-anchor="middle" font-size="13" fill="#4a453d">something buried is found.</text>

  <!-- Footer -->
  <text x="450" y="462" text-anchor="middle" font-size="12" fill="#8a8478" font-style="italic">Same problem shape — pathfinding — but only one of them can plan the whole route in advance.</text>
</svg>
